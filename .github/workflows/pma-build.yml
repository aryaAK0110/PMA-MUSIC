name: PMA Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - run: chmod +x gradlew
      - run: ./gradlew --console=plain assembleFossDebug --no-daemon
        env:
          METROLIST_APPLICATION_ID: com.pma.music
          METROLIST_APP_NAME: PMA MUSIC
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: workflow_dispatch
      - uses: actions/upload-artifact@v4
        with:
          name: pma-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
